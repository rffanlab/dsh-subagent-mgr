name: upstream-contract

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    paths:
      - 'scripts/check-upstream-contract-v4.mjs'
      - '.github/workflows/upstream-contract.yml'
      - 'package.json'
      - 'src/index.js'
      - 'src/backend-hints.js'

permissions:
  contents: read

jobs:
  deepseek-harness-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-upstream-contract-v4.mjs

  published-package-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: node -e "import('./src/index.js').then(m => { if (typeof m.apply !== 'function') process.exit(1) })"
