name: upstream-contract

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    paths:
      - 'scripts/check-upstream-contract-v6.mjs'
      - '.github/workflows/upstream-contract.yml'
      - 'package.json'
      - 'src/index.js'
      - 'src/plugin.js'
      - 'src/telemetry.js'
      - 'src/routing-score.js'
      - 'src/router.js'
      - 'src/backend-hints.js'
      - 'lib/client.js'

permissions:
  contents: read

jobs:
  deepseek-harness-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-upstream-contract-v6.mjs
